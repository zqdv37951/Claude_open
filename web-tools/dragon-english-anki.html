<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>基本英文100 Anki</title>
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eceff4; --text: #1b1f27; --muted: #667085; --border: #dde1e8;
  --accent: #2f6fed; --accent-ink: #ffffff;
  --new: #2f6fed; --learn: #d92d20; --review: #12a150;
  --again: #d92d20; --hard: #a86400; --good: #12a150; --easy: #2f6fed;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 10px 30px rgba(16, 24, 40, .07);
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1218; --surface: #181c24; --surface-2: #222833; --text: #e8ebf0; --muted: #98a2b3; --border: #2c3340;
    --accent: #6d9bff; --accent-ink: #0b1220;
    --new: #6d9bff; --learn: #ff7a70; --review: #4cd08a;
    --again: #ff7a70; --hard: #f0b24a; --good: #4cd08a; --easy: #6d9bff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100dvh;
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "PingFang TC", "Noto Sans TC", "Noto Sans JP", "Microsoft JhengHei", "Yu Gothic", sans-serif;
}
[lang="ja"] { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif; }
[lang="zh-Hant"] { font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
[lang="en"] { font-family: ui-serif, Georgia, "Times New Roman", serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { max-width: 760px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
.top { margin: 4px 0 6px; }
.top h1 { margin: 0; font-size: 19px; line-height: 1.3; }
.top p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

.tabs-wrap { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 12px; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 12px; }
.tab { flex: 1; border: 0; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; padding: 9px 6px; border-radius: 9px; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }

.counts { display: flex; justify-content: center; gap: 30px; margin: 2px 0 14px; }
.count { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: var(--muted); }
.count b { font-size: 24px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.count.new b { color: var(--new); }
.count.learn b { color: var(--learn); }
.count.review b { color: var(--review); }
.count.current b { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 18px 20px; min-height: 230px; display: flex; flex-direction: column; gap: 14px;
}
.card.clickable { cursor: pointer; }
.card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.badge { padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.badge.new { color: var(--new); }
.badge.learn { color: var(--learn); }
.badge.review { color: var(--review); }
.line { display: flex; gap: 10px; align-items: flex-start; }
.tag { flex: none; margin-top: .5em; font-size: 11px; font-weight: 700; line-height: 1; padding: 4px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.line p { margin: 0; flex: 1; white-space: pre-line; overflow-wrap: anywhere; }
.front .line p { font-size: clamp(20px, 4.8vw, 26px); line-height: 1.55; }
.back { display: flex; flex-direction: column; gap: 12px; }
.back .line p { font-size: clamp(17px, 4vw, 20px); }
.speak { flex: none; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); padding: 6px; border-radius: 8px; }
.speak:hover { background: var(--surface-2); color: var(--text); }
.divider { border: 0; border-top: 1px dashed var(--border); margin: 0; }

.actions { margin-top: 14px; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 11px 16px; font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn.primary { width: 100%; padding: 16px; font-size: 16px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--learn); }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 66px; padding: 8px 2px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }
.rate button:hover { background: var(--surface-2); }
.rate .lbl { font-weight: 700; font-size: 15px; }
.rate .iv { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rate .again .lbl { color: var(--again); }
.rate .hard .lbl { color: var(--hard); }
.rate .good .lbl { color: var(--good); }
.rate .easy .lbl { color: var(--easy); }
kbd { font: 11px ui-monospace, monospace; padding: 0 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); background: var(--surface-2); margin-left: 6px; }
.rate kbd { margin: 2px 0 0; }
@media (hover: none) { kbd { display: none; } }
.subactions { display: flex; justify-content: center; margin-top: 12px; }
.link { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 6px 10px; border-radius: 8px; }
.link:hover:not(:disabled) { color: var(--text); background: var(--surface-2); }
.link:disabled { opacity: .4; cursor: default; }

.done { text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 36px 20px; }
.done h2 { margin: 0 0 6px; font-size: 20px; }
.done p { margin: 4px 0; color: var(--muted); }
.done .btn { margin-top: 16px; }

.toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
.toolbar input { flex: 1; min-width: 0; }
input[type="search"], select { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 9px 12px; }
.vis { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 13px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.muted { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px 12px; }
.item-head { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.item .line { padding: 2px 0; }
.item .line p { font-size: 16px; }
.item .line p.blur { filter: blur(7px); cursor: pointer; user-select: none; }
.empty-hint { text-align: center; color: var(--muted); padding: 32px 0; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
.panel h3 { margin: 0 0 10px; font-size: 15px; }
.panel .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; gap: 4px; padding: 3px; background: var(--surface-2); border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); }
.note { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }

@media (prefers-reduced-motion: no-preference) {
  .back { animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>基本英文100 Anki</h1>
    <p>ドラゴン・イングリッシュ ｜ 中・日・英 ｜ 間隔複習</p>
  </header>

  <div class="tabs-wrap">
    <div class="tabs" role="tablist" aria-label="頁籤">
      <button class="tab" role="tab" id="t-study" data-tab="study" aria-controls="tab-study">學習</button>
      <button class="tab" role="tab" id="t-all" data-tab="all" aria-controls="tab-all">全部詞條</button>
      <button class="tab" role="tab" id="t-settings" data-tab="settings" aria-controls="tab-settings">設定與統計</button>
    </div>
  </div>

  <main>
    <section id="tab-study" role="tabpanel" aria-labelledby="t-study">
      <div class="counts" aria-label="今日進度">
        <div class="count new" id="k-new"><b id="cNew">0</b><span>新卡</span></div>
        <div class="count learn" id="k-learn"><b id="cLearn">0</b><span>學習中</span></div>
        <div class="count review" id="k-review"><b id="cDue">0</b><span>待複習</span></div>
      </div>

      <article class="card" id="card">
        <div class="card-meta"><span id="cardNo"></span><span class="badge" id="cardBadge"></span></div>
        <div class="front" id="front"></div>
        <hr class="divider" id="divider" hidden>
        <div class="back" id="back" hidden></div>
      </article>

      <div class="actions" id="actions">
        <button class="btn primary" id="showBtn" type="button">顯示答案<kbd>Space</kbd></button>
        <div class="rate" id="rate" hidden>
          <button type="button" class="again" data-r="1"><span class="lbl">重來</span><span class="iv"></span><kbd>1</kbd></button>
          <button type="button" class="hard" data-r="2"><span class="lbl">困難</span><span class="iv"></span><kbd>2</kbd></button>
          <button type="button" class="good" data-r="3"><span class="lbl">良好</span><span class="iv"></span><kbd>3</kbd></button>
          <button type="button" class="easy" data-r="4"><span class="lbl">簡單</span><span class="iv"></span><kbd>4</kbd></button>
        </div>
        <div class="subactions"><button class="link" id="undoBtn" type="button">復原上一張 <kbd>Z</kbd></button></div>
      </div>

      <div class="done" id="done" hidden>
        <h2 id="doneTitle"></h2>
        <p id="doneMsg"></p>
        <p id="doneNext"></p>
        <button class="btn" id="moreBtn" type="button" hidden>再學 10 張新卡</button>
        <div class="subactions"><button class="link" id="undoBtn2" type="button">復原上一張</button></div>
      </div>
    </section>

    <section id="tab-all" role="tabpanel" aria-labelledby="t-all" hidden>
      <div class="toolbar">
        <input type="search" id="q" placeholder="搜尋 中／日／英／編號" aria-label="搜尋詞條">
        <select id="filter" aria-label="狀態篩選">
          <option value="all">全部狀態</option>
          <option value="new">新卡</option>
          <option value="learn">學習中</option>
          <option value="review">複習中</option>
        </select>
      </div>
      <div class="vis" role="group" aria-label="顯示語言">
        <span>顯示</span>
        <button class="chip" type="button" data-vis="zh" aria-pressed="true">中</button>
        <button class="chip" type="button" data-vis="ja" aria-pressed="true">日</button>
        <button class="chip" type="button" data-vis="en" aria-pressed="true">英</button>
        <span>關閉的語言會模糊，點一下可單獨顯示</span>
      </div>
      <p class="muted" id="allCount"></p>
      <ol class="list" id="list"></ol>
    </section>

    <section id="tab-settings" role="tabpanel" aria-labelledby="t-settings" hidden>
      <div class="panel">
        <h3>卡片正面語言</h3>
        <div class="row">
          <div class="seg" id="frontSeg" role="group" aria-label="正面語言">
            <button type="button" data-front="zh" aria-pressed="false">中文</button>
            <button type="button" data-front="ja" aria-pressed="false">日文</button>
            <button type="button" data-front="en" aria-pressed="false">英文</button>
          </div>
        </div>
        <p class="note">正面顯示所選語言，翻面後顯示另外兩種語言。</p>
      </div>
      <div class="panel">
        <h3>每日新卡數</h3>
        <div class="row">
          <label for="newPerDay">每天最多學習幾張新卡</label>
          <select id="newPerDay"></select>
        </div>
      </div>
      <div class="panel">
        <h3>學習統計</h3>
        <div class="stats" id="stats"></div>
        <p class="note">「已熟悉」＝複習間隔 21 天以上。進度只存在這個瀏覽器（localStorage）；清除網站資料或換裝置會歸零。</p>
      </div>
      <div class="panel">
        <h3>重置</h3>
        <button class="btn danger" id="resetBtn" type="button">清除所有學習進度</button>
      </div>
    </section>
  </main>
  <noscript><p class="empty-hint">需要啟用 JavaScript 才能使用。</p></noscript>
</div>

<script>
(() => {
'use strict';

const DECK = [
{"id": 1, "zh": "喝了兩瓶威士忌還開車是很危險的。", "ja": "ウィスキーのボトルを2本も空けて車を運転するのは危険だ。", "en": "It would be dangerous to drink two bottles of whiskey and drive a car."},
{"id": 2, "zh": "在綠燈亮起之前就穿越車流量大的馬路，是非常危險的。", "ja": "交通量の多い通りを、信号が青に変わらないうちに横断することはとても危険です。", "en": "It is very dangerous to cross a busy street before the light turns green."},
{"id": 3, "zh": "清晨一邊聽著鳥鳴一邊散步，真的很舒服。", "ja": "早朝、鳥のさえずりを聴きながら散歩するのは本当に気持ちがいい。", "en": "It is really pleasant to take a walk early in the morning, listening to birds singing."},
{"id": 4, "zh": "日本的高中生當中，有些人為了準備大學入學考試而去補習班。", "ja": "日本の高校生の中には、大学入試に備えるため塾に行く。", "en": "Most Japanese high school students go to a cram school to prepare for university entrance exams."},

{"id": 6, "zh": "坐在我旁邊的老奶奶在火車上問我要去哪裡。", "ja": "列車で隣に座ったおばあさんに、どこまで行くのと尋ねられた。", "en": "An elderly woman sitting next to me on the train asked me where I was going."},
{"id": 7, "zh": "山姆說，因為大眾運輸不方便，不如租輛車到處逛逛那座城市怎麼樣。", "ja": "公共の交通機関では不便だから、レンタカーを借りてその街をあちこち見てまわるのはどうだろう、とサムは言った。", "en": "Sam suggested that we should rent a car to get around the city because the public transportation was inconvenient."},

const LANGS = {
  zh: { tag: '中', name: '中文', speech: 'zh-TW', html: 'zh-Hant' },
  ja: { tag: '日', name: '日文', speech: 'ja-JP', html: 'ja' },
  en: { tag: '英', name: '英文', speech: 'en-US', html: 'en' },
};
const ORDER = ['zh', 'ja', 'en'];
const MIN = 60000, DAY = 86400000;
const STEPS = [1, 10], RELEARN = [10];
const LEARN_AHEAD = 20 * MIN;
const GRAD_IVL = 1, EASY_IVL = 4;
const NEW_LIMITS = [5, 10, 15, 20, 30, 50, 100];
const SPEAKER = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const CAN_SPEAK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

/* ---------- storage ---------- */
const store = (() => {
  try { const k = '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; }
  catch (e) { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; }
})();
const KEY = 'dragon100.v1.';
const load = (k, fb) => { try { const v = JSON.parse(store.getItem(KEY + k)); return v == null ? fb : v; } catch (e) { return fb; } };
const save = (k, v) => { try { store.setItem(KEY + k, JSON.stringify(v)); } catch (e) { /* storage full or blocked */ } };

/* ---------- state ---------- */
const fresh = () => ({ s: 0, step: 0, ease: 2.5, ivl: 0, due: 0, reps: 0, lapses: 0 });
let prog = load('cards', {});
DECK.forEach(d => { prog[d.id] = Object.assign(fresh(), prog[d.id]); });
let settings = Object.assign({ front: 'ja', newPerDay: 10, vis: { zh: true, ja: true, en: true } }, load('settings', {}));
settings.vis = Object.assign({ zh: true, ja: true, en: true }, settings.vis);
let daily = load('daily', null);
let tab = 'study', currentId = null, revealed = false;
const undoStack = [];

/* ---------- time helpers (study day rolls over at 04:00) ---------- */
function dayStart(now) { const d = new Date(now); d.setHours(4, 0, 0, 0); if (d.getTime() > now) d.setDate(d.getDate() - 1); return d.getTime(); }
function dayKey(now) { const d = new Date(dayStart(now)); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function dueInDays(n, now) { const d = new Date(dayStart(now)); d.setDate(d.getDate() + n); return d.getTime(); }
function ensureDaily(now) {
  const k = dayKey(now);
  if (!daily || daily.day !== k) { daily = { day: k, newDone: 0, extra: 0 }; save('daily', daily); }
}

/* ---------- scheduler (simplified Anki SM-2) ---------- */
// s: 0 new, 1 learning, 2 review, 3 relearning
function schedule(c, r, now) {
  const n = Object.assign({}, c, { reps: c.reps + 1 });
  if (c.s !== 2) {
    const relearn = c.s === 3;
    const steps = relearn ? RELEARN : STEPS;
    const s0 = c.s === 0 ? 0 : Math.min(c.step, steps.length - 1);
    const stay = relearn ? 3 : 1;
    const learn = (step, mins) => { n.s = stay; n.step = step; n.due = now + mins * MIN; };
    if (r === 1) learn(0, steps[0]);
    else if (r === 2) learn(s0, s0 === 0 ? (steps.length > 1 ? (steps[0] + steps[1]) / 2 : steps[0] * 1.5) : steps[s0]);
    else if (r === 3 && s0 + 1 < steps.length) learn(s0 + 1, steps[s0 + 1]);
    else {
      n.s = 2; n.step = 0;
      n.ivl = relearn ? c.ivl + (r === 4 ? 1 : 0) : (r === 4 ? EASY_IVL : GRAD_IVL);
      n.due = dueInDays(n.ivl, now);
    }
    return n;
  }
  if (r === 1) {
    n.lapses = c.lapses + 1; n.ease = Math.max(1.3, c.ease - 0.2);
    n.ivl = 1; n.s = 3; n.step = 0; n.due = now + RELEARN[0] * MIN;
    return n;
  }
  const hard = Math.max(c.ivl + 1, Math.round(c.ivl * 1.2));
  const good = Math.max(hard + 1, Math.round(c.ivl * c.ease));
  const easy = Math.max(good + 1, Math.round(c.ivl * c.ease * 1.3));
  n.ivl = r === 2 ? hard : r === 3 ? good : easy;
  if (r === 2) n.ease = Math.max(1.3, c.ease - 0.15);
  if (r === 4) n.ease = c.ease + 0.15;
  n.due = dueInDays(n.ivl, now);
  return n;
}

function fmtDays(d) {
  if (d < 30) return d + '天';
  if (d < 365) return (Math.round(d / 30 * 10) / 10) + '個月';
  return (Math.round(d / 365 * 10) / 10) + '年';
}
function fmtMin(m) {
  if (m < 1) return '<1分';
  if (m < 60) return Math.round(m) + '分';
  if (m < 1440) return Math.round(m / 60) + '小時';
  return fmtDays(Math.round(m / 1440));
}
function fmtLabel(next, now) { return (next.s === 1 || next.s === 3) ? fmtMin((next.due - now) / MIN) : fmtDays(next.ivl); }

/* ---------- queue ---------- */
const isLearn = p => p.s === 1 || p.s === 3;
const stateKey = p => (p.s === 0 ? 'new' : isLearn(p) ? 'learn' : 'review');
const STATE_TEXT = { 0: '新卡', 1: '學習中', 2: '複習', 3: '重學' };
const newAllowance = () => Math.max(0, settings.newPerDay + daily.extra - daily.newDone);

function pickNext(now) {
  let best = null;
  for (const d of DECK) { const p = prog[d.id]; if (isLearn(p) && p.due <= now && (!best || p.due < prog[best.id].due)) best = d; }
  if (best) return best;
  for (const d of DECK) { const p = prog[d.id]; if (p.s === 2 && p.due <= now && (!best || p.due < prog[best.id].due)) best = d; }
  if (best) return best;
  if (newAllowance() > 0) { const d = DECK.find(x => prog[x.id].s === 0); if (d) return d; }
  for (const d of DECK) { const p = prog[d.id]; if (isLearn(p) && p.due <= now + LEARN_AHEAD && (!best || p.due < prog[best.id].due)) best = d; }
  return best;
}
function counts(now) {
  let n = 0, l = 0, r = 0;
  for (const d of DECK) { const p = prog[d.id]; if (p.s === 0) n++; else if (isLearn(p)) l++; else if (p.due <= now) r++; }
  return { newC: Math.min(n, newAllowance()), learn: l, due: r, newTotal: n };
}

/* ---------- dom helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid);
  return el;
}
function speak(text, lang) {
  if (!CAN_SPEAK) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\n/g, ' '));
  u.lang = lang; u.rate = lang === 'en-US' ? 0.92 : 0.95;
  speechSynthesis.speak(u);
}
function lineEl(card, lang, extra) {
  const L = LANGS[lang];
  const p = h('p', { lang: L.html, text: card[lang], class: extra || null });
  const kids = [h('span', { class: 'tag', text: L.tag }), p];
  if (CAN_SPEAK) {
    const b = h('button', { class: 'speak', type: 'button', 'aria-label': '朗讀' + L.name, html: SPEAKER });
    b.addEventListener('click', e => { e.stopPropagation(); speak(card[lang], L.speech); });
    kids.push(b);
  }
  return h('div', { class: 'line' }, kids);
}

/* ---------- study tab ---------- */
function renderCounts(now) {
  const c = counts(now);
  $('#cNew').textContent = c.newC; $('#cLearn').textContent = c.learn; $('#cDue').textContent = c.due;
  const cur = currentId != null ? stateKey(prog[currentId]) : null;
  $('#k-new').classList.toggle('current', cur === 'new');
  $('#k-learn').classList.toggle('current', cur === 'learn');
  $('#k-review').classList.toggle('current', cur === 'review');
  return c;
}
function renderStudy() {
  const now = Date.now();
  ensureDaily(now);
  const cnt = renderCounts(now);
  const has = currentId != null;
  $('#card').hidden = !has; $('#actions').hidden = !has; $('#done').hidden = has;
  $('#undoBtn').disabled = undoStack.length === 0;
  $('#undoBtn2').disabled = undoStack.length === 0;
  if (!has) { renderDone(now, cnt); return; }

  const card = DECK[currentId - 1], p = prog[currentId];
  $('#cardNo').textContent = '#' + card.id + ' / ' + DECK.length;
  const badge = $('#cardBadge');
  badge.textContent = STATE_TEXT[p.s]; badge.className = 'badge ' + stateKey(p);
  $('#front').replaceChildren(lineEl(card, settings.front));
  $('#back').replaceChildren(...ORDER.filter(l => l !== settings.front).map(l => lineEl(card, l)));
  $('#card').classList.toggle('clickable', !revealed);
  $('#back').hidden = !revealed; $('#divider').hidden = !revealed;
  $('#showBtn').hidden = revealed; $('#rate').hidden = !revealed;
  if (revealed) {
    $$('#rate button').forEach(b => { b.querySelector('.iv').textContent = fmtLabel(schedule(p, +b.dataset.r, now), now); });
  }
}
function fmtWait(ms) {
  const m = ms / MIN;
  if (m < 60) return Math.max(1, Math.ceil(m)) + ' 分鐘後';
  if (m < 1440) return Math.round(m / 60) + ' 小時後';
  return Math.round(m / 1440) + ' 天後';
}
function renderDone(now, cnt) {
  const started = DECK.length - cnt.newTotal;
  let next = null;
  for (const d of DECK) { const p = prog[d.id]; if (p.s !== 0 && p.due > now && (next == null || p.due < next)) next = p.due; }
  const moreNew = cnt.newTotal > 0;
  $('#doneTitle').textContent = started === 0 ? '沒有可學習的卡片' : moreNew ? '今天的額度完成了' : '目前沒有要複習的卡片';
  $('#doneMsg').textContent = moreNew
    ? '今天的新卡額度（' + (settings.newPerDay + daily.extra) + ' 張）已用完，還有 ' + cnt.newTotal + ' 張新卡沒開始。'
    : '全部 ' + DECK.length + ' 張都已開始學習。';
  $('#doneNext').textContent = next != null ? '下一張卡片：' + fmtWait(next - now) + '到期' : '';
  $('#moreBtn').hidden = !moreNew;
}
function advance() {
  const now = Date.now();
  ensureDaily(now);
  const c = pickNext(now);
  currentId = c ? c.id : null; revealed = false;
  render();
}
function reveal() { if (currentId == null || revealed) return; revealed = true; renderStudy(); }
function rate(r) {
  if (currentId == null || !revealed) return;
  const now = Date.now(); ensureDaily(now);
  const id = currentId, p = prog[id];
  undoStack.push({ id, prev: Object.assign({}, p), daily: Object.assign({}, daily) });
  if (undoStack.length > 30) undoStack.shift();
  if (p.s === 0) daily.newDone++;
  prog[id] = schedule(p, r, now);
  save('cards', prog); save('daily', daily);
  advance();
}
function undo() {
  const u = undoStack.pop();
  if (!u) return;
  prog[u.id] = u.prev; daily = u.daily;
  save('cards', prog); save('daily', daily);
  currentId = u.id; revealed = false;
  render();
}

/* ---------- all-entries tab ---------- */
function renderAll() {
  const q = $('#q').value.trim().toLowerCase(), f = $('#filter').value;
  const list = $('#list');
  list.replaceChildren();
  let n = 0;
  for (const c of DECK) {
    const p = prog[c.id];
    if (f !== 'all' && stateKey(p) !== f) continue;
    if (q && !(String(c.id) === q || (c.zh + '\n' + c.ja + '\n' + c.en).toLowerCase().includes(q))) continue;
    n++;
    const head = h('div', { class: 'item-head' },
      h('span', { text: '#' + c.id }),
      h('span', { class: 'badge ' + stateKey(p), text: p.s === 2 ? '複習・' + fmtDays(p.ivl) : STATE_TEXT[p.s] }));
    const lines = ORDER.map(l => {
      const el = lineEl(c, l, settings.vis[l] ? null : 'blur');
      const para = el.querySelector('p');
      para.addEventListener('click', () => { if (!settings.vis[l]) para.classList.toggle('blur'); });
      return el;
    });
    list.append(h('li', { class: 'item' }, head, lines));
  }
  if (n === 0) list.append(h('li', { class: 'empty-hint', text: '沒有符合的詞條' }));
  $('#allCount').textContent = '顯示 ' + n + ' / ' + DECK.length + ' 條';
  $$('[data-vis]').forEach(b => b.setAttribute('aria-pressed', String(!!settings.vis[b.dataset.vis])));
}

/* ---------- settings tab ---------- */
function renderSettings() {
  $$('#frontSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.front === settings.front)));
  $('#newPerDay').value = String(settings.newPerDay);
  let nw = 0, lr = 0, yg = 0, mt = 0, reps = 0;
  for (const d of DECK) {
    const p = prog[d.id]; reps += p.reps;
    if (p.s === 0) nw++; else if (isLearn(p)) lr++; else if (p.ivl >= 21) mt++; else yg++;
  }
  ensureDaily(Date.now());
  const st = [[DECK.length, '總詞條'], [nw, '新卡'], [lr, '學習中'], [yg, '複習中'], [mt, '已熟悉'], [daily.newDone, '今日新卡'], [reps, '累計作答次數']];
  $('#stats').replaceChildren(...st.map(([v, l]) => h('div', { class: 'stat' }, h('b', { text: v }), h('span', { text: l }))));
}

/* ---------- tabs / render ---------- */
const TABS = ['study', 'all', 'settings'];
function render() {
  if (tab === 'study') renderStudy();
  else if (tab === 'all') renderAll();
  else renderSettings();
}
function setTab(t, focusTab) {
  if (!TABS.includes(t)) t = 'study';
  tab = t;
  TABS.forEach(k => {
    const b = $('#t-' + k), on = k === t;
    b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1;
    $('#tab-' + k).hidden = !on;
    if (on && focusTab) b.focus();
  });
  try { history.replaceState(null, '', '#' + t); } catch (e) { /* ignore */ }
  if (t === 'study' && currentId == null) advance(); else render();
}

/* ---------- wiring ---------- */
$$('.tab').forEach(b => {
  b.addEventListener('click', () => setTab(b.dataset.tab));
  b.addEventListener('keydown', e => {
    const i = TABS.indexOf(b.dataset.tab);
    if (e.key === 'ArrowRight') { e.preventDefault(); setTab(TABS[(i + 1) % TABS.length], true); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); setTab(TABS[(i + TABS.length - 1) % TABS.length], true); }
  });
});
$('#showBtn').addEventListener('click', reveal);
$('#card').addEventListener('click', e => { if (!revealed && !e.target.closest('button')) reveal(); });
$$('#rate button').forEach(b => b.addEventListener('click', () => rate(+b.dataset.r)));
$('#undoBtn').addEventListener('click', undo);
$('#undoBtn2').addEventListener('click', undo);
$('#moreBtn').addEventListener('click', () => { ensureDaily(Date.now()); daily.extra += 10; save('daily', daily); advance(); });

$('#q').addEventListener('input', renderAll);
$('#filter').addEventListener('change', renderAll);
$$('[data-vis]').forEach(b => b.addEventListener('click', () => {
  settings.vis[b.dataset.vis] = !settings.vis[b.dataset.vis]; save('settings', settings); renderAll();
}));

$$('#frontSeg button').forEach(b => b.addEventListener('click', () => {
  settings.front = b.dataset.front; save('settings', settings); renderSettings();
}));
$('#newPerDay').append(...NEW_LIMITS.map(n => h('option', { value: n, text: n + ' 張' })));
$('#newPerDay').addEventListener('change', e => {
  settings.newPerDay = +e.target.value; save('settings', settings); currentId = null; renderSettings();
});
$('#resetBtn').addEventListener('click', () => {
  if (!confirm('確定要清除所有學習進度嗎？此動作無法復原。')) return;
  prog = {}; DECK.forEach(d => { prog[d.id] = fresh(); });
  daily = null; undoStack.length = 0; currentId = null; revealed = false;
  save('cards', prog); store.removeItem(KEY + 'daily');
  renderSettings();
});

document.addEventListener('keydown', e => {
  if (tab !== 'study') return;
  const t = e.target;
  if (t.matches && t.matches('input, select, textarea')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) {
    if (e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') {
    if (t.closest && t.closest('button') && !t.closest('.tabs')) return;
    if (currentId == null) return;
    e.preventDefault();
    if (!revealed) reveal(); else rate(3);
  } else if (/^[1-4]$/.test(e.key)) {
    rate(+e.key);
  } else if (e.key.toLowerCase() === 'z') {
    undo();
  }
});

setInterval(() => {
  if (document.hidden || tab !== 'study') return;
  if (currentId == null) advance(); else renderCounts(Date.now());
}, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && tab === 'study' && currentId == null) advance(); });

setTab(location.hash.replace('#', ''));
})();
</script>
</body>
