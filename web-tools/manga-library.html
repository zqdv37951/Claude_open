<!doctype html>
<html lang="zh-Hant" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<!-- 內容安全政策：這個頁面只需要連 Apps Script（含它轉址去的 googleusercontent），圖片只來自本機（blob／data）。就算哪天有人塞進惡意字串，也無法把資料傳到別的網站 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src https://script.google.com https://*.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<title>漫畫圖書館</title>
<style>
:root {
  --bg: #0d0f14; --surface: #151922; --surface2: #1d2230; --surface3: #262c3d;
  --text: #e9ecf4; --muted: #8d96ab; --line: rgba(255,255,255,.08);
  --accent: #8aa4ff; --accent-ink: #0d0f14; --danger: #ff8a8a; --ok: #7be0a5; --red: #ff7a7a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  --tile: 176px; --gutter: 22px;
  color-scheme: dark;
}
html[data-theme="light"] {
  --bg: #f3f4f8; --surface: #ffffff; --surface2: #eceef4; --surface3: #e1e4ee;
  --text: #1a1d27; --muted: #667089; --line: rgba(20,24,40,.1);
  --accent: #4660e6; --accent-ink: #fff; --danger: #c93a3a; --ok: #1f9d5b; --red: #d12f2f;
  --shadow: 0 1px 2px rgba(20,24,40,.12), 0 10px 26px -14px rgba(20,24,40,.35);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  html[data-theme="auto"] {
    --bg: #f3f4f8; --surface: #ffffff; --surface2: #eceef4; --surface3: #e1e4ee;
    --text: #1a1d27; --muted: #667089; --line: rgba(20,24,40,.1);
    --accent: #4660e6; --accent-ink: #fff; --danger: #c93a3a; --ok: #1f9d5b; --red: #d12f2f;
    --shadow: 0 1px 2px rgba(20,24,40,.12), 0 10px 26px -14px rgba(20,24,40,.35);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── 頂端列 ── */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); border-bottom: 1px solid var(--line); padding: 12px var(--gutter) 10px; padding-top: max(12px, env(safe-area-inset-top)); }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: .2px; margin-right: 6px; white-space: nowrap; }
.brand .logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), #c4b5fd); color: var(--accent-ink); font-size: 16px; }
.search { flex: 1 1 280px; min-width: 200px; position: relative; max-width: 640px; }
.search input { width: 100%; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 38px 0 38px; outline: none; transition: border-color .15s, box-shadow .15s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; pointer-events: none; }
.search input:not(:placeholder-shown) ~ kbd { display: none; }
.tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.seg button { border: 0; background: transparent; height: 30px; min-width: 34px; padding: 0 10px; border-radius: 8px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface3); color: var(--text); }
.btn { height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; transition: background .15s; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .55; cursor: default; }
select.btn { padding-right: 6px; }
.size { width: 84px; accent-color: var(--accent); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 30px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; transition: background .15s, color .15s, border-color .15s; }
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--text); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.chip .n { font-size: 11.5px; opacity: .75; font-variant-numeric: tabular-nums; }
.chip .ck { font-size: 11px; color: var(--accent); margin-right: -2px; }
.multi { flex: none; height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px 0 10px; border-radius: 999px; border: 1px dashed var(--line); color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
.multi:hover { color: var(--text); }
.multi:has(input:checked) { color: var(--text); border-style: solid; border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.multi input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.chips .sep { flex: none; width: 1px; background: var(--line); margin: 4px 2px; }

.banner { margin: 12px var(--gutter) 0; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--danger) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.info { background: var(--surface); border-color: var(--line); }
.banner .grow { flex: 1; min-width: 160px; }

.stat { padding: 14px var(--gutter) 2px; color: var(--muted); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }

/* ── 封面牆 ── */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr)); gap: 24px 18px; padding: 14px var(--gutter) 90px; }
.tile { position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; border: 0; padding: 0; text-align: left; color: #fff; border-radius: 14px; overflow: hidden; background: var(--surface2); box-shadow: var(--shadow); transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s; content-visibility: auto; contain-intrinsic-size: auto 235px; }
.tile:hover, .tile:focus-visible { transform: translateY(-5px) scale(1.02); box-shadow: 0 18px 40px -14px rgba(0,0,0,.65); z-index: 2; }
.tile .cv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s ease, transform .5s ease; }
.tile .cv.in { opacity: 1; }
.tile:hover .cv { transform: scale(1.05); }
.tile .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--tile) * .42); font-weight: 800; color: rgba(255,255,255,.22); letter-spacing: -2px; user-select: none; transition: opacity .3s; }
.tile .cv.in ~ .ph { opacity: 0; }
.tile .shade { position: absolute; left: 0; right: 0; bottom: 0; padding: 44px 11px 11px; background: linear-gradient(to top, rgba(6,8,14,.92) 0%, rgba(6,8,14,.55) 55%, rgba(6,8,14,0) 100%); }
.tile .t { font-weight: 650; font-size: 13.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.pg.red { color: var(--red); font-weight: 600; }
.tile .m .pg.red { color: #ff8f8f; }
.covtools { margin-top: 10px; }
.covmsg { margin-top: 6px; font-size: 12.5px; color: var(--muted); min-height: 18px; word-break: break-word; }
.covmsg.ok { color: var(--ok); } .covmsg.err { color: var(--danger); }
.hero .poster.drop { outline: 2px dashed var(--accent); outline-offset: 3px; }
.left { font-size: 12.5px; color: var(--muted); }
.left.red { color: var(--red); }
.left.stale { opacity: .8; font-style: italic; }
.tile .m { font-size: 11.5px; opacity: 0; max-height: 0; margin-top: 0; transition: opacity .2s, max-height .25s, margin-top .25s; color: rgba(255,255,255,.82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile:hover .m, .tile:focus-visible .m { opacity: 1; max-height: 40px; margin-top: 4px; }
.tile .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); border-radius: 0 3px 3px 0; }
.tile .st { position: absolute; top: 8px; left: 8px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 9px; background: rgba(8,10,16,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; font-size: 13px; }
.tile .sc { position: absolute; top: 8px; right: 8px; height: 22px; padding: 0 8px; border-radius: 999px; background: rgba(8,10,16,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: 11px; display: grid; place-items: center; }
.tile.skeleton { background: linear-gradient(100deg, var(--surface2) 30%, var(--surface3) 50%, var(--surface2) 70%); background-size: 300% 100%; animation: shimmer 1.4s infinite linear; box-shadow: none; pointer-events: none; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── 清單 ── */
.rows { display: flex; flex-direction: column; gap: 6px; padding: 14px var(--gutter) 90px; }
.row { display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 8px 12px 8px 8px; border-radius: 12px; border: 1px solid transparent; background: var(--surface); transition: background .15s, border-color .15s; }
.row:hover, .row:focus-visible { background: var(--surface2); border-color: var(--line); }
.row .th { width: 46px; height: 62px; border-radius: 8px; overflow: hidden; position: relative; background: var(--surface3); display: grid; place-items: center; font-weight: 800; color: var(--muted); }
.row .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.row .tt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ss { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rt { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
.row .info { min-width: 0; }

.cont { padding: 10px var(--gutter) 0; }
.cont h3 { margin: 6px 0 10px; font-size: 15px; }
.cont-row { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.cc { flex: none; width: 290px; display: grid; grid-template-columns: 1fr 44px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; scroll-snap-align: start; transition: border-color .15s, background .15s; }
.cc:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.cc-main { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; text-align: left; border: 0; background: transparent; padding: 10px 6px 10px 10px; min-width: 0; }
.cc .th { width: 52px; height: 70px; border-radius: 8px; overflow: hidden; position: relative; display: grid; place-items: center; font-weight: 800; }
.cc .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cc .info { min-width: 0; }
.cc .tt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc .ss { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc .bar2 { margin: 5px 0; }
.cc-go { display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); text-decoration: none; font-size: 15px; }
.cc-go:hover { background: var(--accent); color: var(--accent-ink); }
.empty { text-align: center; color: var(--muted); padding: 90px 20px; }
.empty .big { font-size: 42px; margin-bottom: 8px; }

/* ── 詳情側欄 ── */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100vw); background: var(--surface); z-index: 41; transform: translateX(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); box-shadow: -20px 0 50px -20px rgba(0,0,0,.6); display: flex; flex-direction: column; border-left: 1px solid var(--line); }
.drawer.on { transform: none; }
.dhead { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); padding-top: max(12px, env(safe-area-inset-top)); }
.dhead .grow { flex: 1; }
.dbody { overflow-y: auto; padding: 18px 20px 40px; -webkit-overflow-scrolling: touch; }
.hero { display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-items: start; }
.hero .poster { aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; position: relative; background: var(--surface3); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 54px; font-weight: 800; color: rgba(255,255,255,.25); }
.hero .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero h2 { margin: 0 0 4px; font-size: 20px; line-height: 1.3; word-break: break-word; }
.hero .au { color: var(--muted); margin-bottom: 10px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { height: 24px; border-radius: 999px; background: var(--surface3); padding: 0 10px; display: inline-flex; align-items: center; font-size: 12px; }
.note { margin: 16px 0 4px; padding: 10px 12px; border-radius: 10px; background: var(--surface2); white-space: pre-wrap; word-break: break-word; }
.sec { margin: 22px 0 8px; font-size: 12.5px; color: var(--muted); letter-spacing: .4px; text-transform: uppercase; }
.src { padding: 12px; border-radius: 12px; background: var(--surface2); margin-bottom: 10px; }
.src .h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.src .site { font-weight: 650; color: var(--accent); }
.src .when { color: var(--muted); font-size: 12px; margin-left: auto; }
.src .ch { word-break: break-word; }
.bar2 { height: 5px; border-radius: 3px; background: var(--surface3); margin: 8px 0; overflow: hidden; }
.bar2 > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
a.btn { text-decoration: none; }

/* ── 連線設定 ── */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.6); }
.modal[hidden] { display: none; }
.card { width: min(460px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: var(--shadow); }
.card h2 { margin: 0 0 6px; font-size: 19px; }
.card p { color: var(--muted); margin: 0 0 16px; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.field input { width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; }
.msg { min-height: 20px; margin: 4px 0 12px; font-size: 13px; }
.msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }
.card .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

@media (max-width: 640px) {
  :root { --gutter: 14px; --tile: 140px; }
  .wall { gap: 18px 12px; }
  .brand span.name { display: none; }
  .bar { gap: 8px; }
  .search { flex: 1 1 0; min-width: 0; }
  .search kbd { display: none; }
  .tools { margin-left: 0; width: 100%; justify-content: space-between; flex-wrap: nowrap; }
  .tools .btn { padding: 0 10px; }
  #refreshTxt { display: none; }
  #sort { max-width: 118px; }
  .cc { width: 250px; }
  .tools .size { display: none; }
  .drawer { top: auto; height: 92vh; width: 100vw; transform: translateY(105%); border-left: 0; border-radius: 18px 18px 0 0; }
  .drawer.on { transform: none; }
  .hero { grid-template-columns: 110px 1fr; gap: 14px; }
  .row { grid-template-columns: 46px 1fr; }
  .row .rt { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="bar">
      <div class="brand"><div class="logo" aria-hidden="true">📚</div><span class="name">漫畫圖書館</span></div>
      <div class="search">
        <span class="ico" aria-hidden="true">🔍</span>
        <label class="sr" for="q">搜尋</label>
        <input id="q" type="search" placeholder="搜尋書名、作者…　例：tag:在看 site:紳士" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <div class="tools">
        <div class="seg" role="group" aria-label="檢視方式">
          <button id="v-wall" type="button" aria-pressed="true" title="封面牆">▦</button>
          <button id="v-list" type="button" aria-pressed="false" title="清單">☰</button>
        </div>
        <label class="sr" for="size">封面大小</label>
        <input id="size" class="size" type="range" min="120" max="280" step="8" title="封面大小">
        <select id="sort" class="btn" aria-label="排序">
          <option value="recent">最近閱讀</option>
          <option value="name">書名</option>
          <option value="sites">網站數</option>
          <option value="left">剩最多話沒看</option>
        </select>
        <button id="theme" class="btn" type="button" title="切換主題">🌓</button>
        <button id="refresh" class="btn" type="button" title="重新整理">⟳ <span id="refreshTxt">重新整理</span></button>
        <button id="settings" class="btn" type="button" title="連線設定">⚙</button>
      </div>
    </div>
    <div id="chips" class="chips" role="group" aria-label="篩選"></div>
  </header>
  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
  <div id="stat" class="stat"></div>
  <main id="main"></main>
</div>

<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="作品詳情" aria-hidden="true">
  <div class="dhead">
    <button id="dprev" class="btn" type="button" title="上一部（←）">‹</button>
    <button id="dnext" class="btn" type="button" title="下一部（→）">›</button>
    <span class="grow"></span>
    <button id="dclose" class="btn" type="button" title="關閉（Esc）">✕</button>
  </div>
  <div id="dbody" class="dbody"></div>
</aside>

<div id="connect" class="modal" hidden>
  <form class="card" id="connectForm" autocomplete="off">
    <h2>連線到你的試算表</h2>
    <p>填入 Apps Script 的網址（結尾是 <code>/exec</code>）和密鑰。只會存在這個瀏覽器，不會傳給別人。</p>
    <label class="field"><span>Apps Script 網址</span><input id="cUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" required></label>
    <label class="field"><span>密鑰（TOKEN）</span><input id="cTok" type="password" placeholder="密鑰" required></label>
    <div id="cMsg" class="msg" role="status"></div>
    <div class="btns">
      <button id="cLogout" class="btn" type="button" hidden title="清掉這個瀏覽器裡的網址、密鑰、資料與封面">登出並清除本機資料</button>
      <button id="cCancel" class="btn" type="button" hidden>取消</button>
      <button id="cTest" class="btn" type="button">測試連線</button>
      <button class="btn primary" type="submit">儲存並載入</button>
    </div>
  </form>
</div>

<script>

function gridMove(cur, key) {
  if (!cur || !cur.closest || !cur.closest('#items')) return false;

  else if (key === 'ArrowLeft' && wall) to = items[i - 1];

    if (!wall) to = items[i + (down ? 1 : -1)];
    else {
      const r = cur.getBoundingClientRect(), dir = down ? 1 : -1;

        if (o === cur) return;
        const q = o.getBoundingClientRect(), dy = (q.top - r.top) * dir, dx = Math.abs(q.left - r.left);

  b.hidden = false; b.className = 'banner' + (kind === 'info' ? ' info' : '');
  const t = document.createElement('span'); t.className = 'grow'; t.textContent = msg; b.append(t);
  if (retry) { const r = document.createElement('button'); r.className = 'btn'; r.type = 'button'; r.textContent = '重試'; r.addEventListener('click', refresh); b.append(r); }
}
async function refresh() {
  if (!connected()) { openConnect(true); return; }
  if (loading) return;

  $('refresh').disabled = true; $('refreshTxt').textContent = '載入中…';
  if (!data) render();
  try {
    const r = await api({ type: 'shelf' });
    data = { at: Date.now(), rows: r.rows || [], groups: r.groups || {} };
    noCache = !LS.set(DATA_KEY, data);
    lastError = '';
    banner('');
    loading = false;
    render();
    syncCovers();
  } catch (e) {
    lastError = e && e.message ? e.message : String(e);
    loading = false;
    banner('連線失敗：' + lastError + (/密鑰/.test(lastError) ? '（請按右上角 ⚙ 檢查密鑰）' : '') + (data ? '。目前顯示的是' + relTime(data.at) + '的資料。' : ''), 'err', true);

document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '');
  if (e.key === 'Escape') {
    if (!$('connect').hidden && connected()) { closeConnect(); return; }
    if (openKey) { closeDrawer(); return; }
    if (document.activeElement === $('q') && $('q').value) { $('q').value = ''; query = ''; render(); return; }
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('q').focus(); }
  else if (openKey && e.key === 'ArrowLeft') stepDrawer(-1);
  else if (openKey && e.key === 'ArrowRight') stepDrawer(1);

(async function start() {
  applyTheme(); applySize(); $('sort').value = ui.sort;
  $('theme').title = '主題：' + ({ auto: '跟隨系統', dark: '深色', light: '淺色' })[ui.theme];
  render(); // 先用快取的資料畫出來（不等封面），封面從 IndexedDB 讀好後再補上
  if (!connected()) { openConnect(true); return; }
  if (data) banner('顯示的是上次的資料，正在更新…', 'info');
  await loadCachedCovers();
  repaintCovers();
  refresh();
})();
</script>
</body>
</html>
