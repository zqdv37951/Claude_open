<title>漫畫圖書館</title>
<style>
:root {
  --bg: #0d0f14; --surface: #151922; --surface2: #1d2230; --surface3: #262c3d;
  --text: #e9ecf4; --muted: #8d96ab; --line: rgba(255,255,255,.08);
  --accent: #8aa4ff; --accent-ink: #0d0f14; --danger: #ff8a8a; --ok: #7be0a5; --red: #ff7a7a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  --tile: 176px; --gutter: 22px;
  color-scheme: dark;
}
html[data-theme="light"] {
  --bg: #f3f4f8; --surface: #ffffff; --surface2: #eceef4; --surface3: #e1e4ee;
  --text: #1a1d27; --muted: #667089; --line: rgba(20,24,40,.1);
  --accent: #4660e6; --accent-ink: #fff; --danger: #c93a3a; --ok: #1f9d5b; --red: #d12f2f;
  --shadow: 0 1px 2px rgba(20,24,40,.12), 0 10px 26px -14px rgba(20,24,40,.35);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  html[data-theme="auto"] {
    --bg: #f3f4f8; --surface: #ffffff; --surface2: #eceef4; --surface3: #e1e4ee;
    --text: #1a1d27; --muted: #667089; --line: rgba(20,24,40,.1);
    --accent: #4660e6; --accent-ink: #fff; --danger: #c93a3a; --ok: #1f9d5b; --red: #d12f2f;
    --shadow: 0 1px 2px rgba(20,24,40,.12), 0 10px 26px -14px rgba(20,24,40,.35);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── 頂端列 ── */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); border-bottom: 1px solid var(--line); padding: 12px var(--gutter) 10px; padding-top: max(12px, env(safe-area-inset-top)); }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: .2px; margin-right: 6px; white-space: nowrap; }
.brand .logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), #c4b5fd); color: var(--accent-ink); font-size: 16px; }
.search { flex: 1 1 280px; min-width: 200px; position: relative; max-width: 640px; }
.search input { width: 100%; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 38px 0 38px; outline: none; transition: border-color .15s, box-shadow .15s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; pointer-events: none; }
.search input:not(:placeholder-shown) ~ kbd { display: none; }
.tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.seg button { border: 0; background: transparent; height: 30px; min-width: 34px; padding: 0 10px; border-radius: 8px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface3); color: var(--text); }
.btn { height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; transition: background .15s; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .55; cursor: default; }
select.btn { padding-right: 6px; }
.size { width: 84px; accent-color: var(--accent); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 30px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; transition: background .15s, color .15s, border-color .15s; }
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--text); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.chip .n { font-size: 11.5px; opacity: .75; font-variant-numeric: tabular-nums; }
.chip .ck { font-size: 11px; color: var(--accent); margin-right: -2px; }
.savebtn { border-style: dashed; color: var(--accent); }
.savebtn:hover { color: var(--text); border-color: var(--accent); }
.grpform { flex: none; display: inline-flex; align-items: center; gap: 6px; }
.grpform input { height: 30px; width: 200px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); background: var(--surface); color: var(--text); padding: 0 12px; font: inherit; font-size: 13px; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.grperr { font-size: 12.5px; color: var(--danger); white-space: nowrap; }
.chipx { flex: none; width: 28px; height: 28px; margin-left: -4px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
.chipx:hover, .chipx:focus-visible { background: var(--surface2); }
.chipx.armed { width: auto; padding: 0 9px; border-radius: 999px; background: var(--danger); color: var(--accent-ink); border-color: var(--danger); }
.chips .sep { flex: none; width: 1px; background: var(--line); margin: 4px 2px; }

.banner { margin: 12px var(--gutter) 0; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--danger) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.info { background: var(--surface); border-color: var(--line); }
.morewrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; width: 280px; max-width: calc(100vw - 2 * var(--gutter)); padding: 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.menu .menuitem { width: 100%; height: 36px; border-radius: 8px; padding: 0 10px; display: flex; align-items: center; text-align: left; font-size: 14px; }
.menu .menuitem:hover, .menu .menuitem:focus-visible { background: var(--surface2); }
.menu .menuitem[disabled] { opacity: .5; cursor: default; }
.pickcard { width: min(580px, 100%); max-height: min(88vh, 760px); display: flex; flex-direction: column; }
.pickq { width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 12px; margin-bottom: 10px; }

.pickrow { text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); display: grid; gap: 2px; width: 100%; }
.pickrow:hover, .pickrow:focus-visible { border-color: var(--accent); }
.pickrow .tt { font-weight: 600; word-break: break-word; }
.pickrow .sub { font-size: 12px; color: var(--muted); }
.pickrow .sug { color: var(--ok); font-size: 12px; font-weight: 600; }
.pickconfirm { padding: 10px 12px; border-radius: 10px; background: var(--surface2); margin-bottom: 10px; line-height: 1.6; word-break: break-word; }
.bmgroup { padding: 10px 12px; border-radius: 12px; background: var(--surface2); }

.bmrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
.bmrow .bt { flex: 1 1 140px; font-size: 13.5px; word-break: break-word; }
.rel { padding: 10px 12px; border-radius: 12px; background: var(--surface2); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rel .rt2 { flex: 1 1 160px; word-break: break-word; }
.rel .rl { color: var(--accent); font-weight: 650; font-size: 12.5px; }
.menu .hint { padding: 4px 10px 6px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.banner .grow { flex: 1; min-width: 160px; }

.stat { padding: 14px var(--gutter) 2px; color: var(--muted); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }

/* ── 封面牆 ── */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr)); gap: 24px 18px; padding: 14px var(--gutter) 90px; }
.tile { position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; border: 0; padding: 0; text-align: left; color: #fff; border-radius: 14px; overflow: hidden; background: var(--surface2); box-shadow: var(--shadow); transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s; content-visibility: auto; contain-intrinsic-size: auto 235px; }
.tile:hover, .tile:focus-visible { transform: translateY(-5px) scale(1.02); box-shadow: 0 18px 40px -14px rgba(0,0,0,.65); z-index: 2; }
.tile .cv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s ease, transform .5s ease; }
.tile .cv.in { opacity: 1; }
.tile:hover .cv { transform: scale(1.05); }
.tile .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--tile) * .42); font-weight: 800; color: rgba(255,255,255,.22); letter-spacing: -2px; user-select: none; transition: opacity .3s; }
.tile .cv.in ~ .ph { opacity: 0; }
.tile .shade { position: absolute; left: 0; right: 0; bottom: 0; padding: 44px 11px 11px; background: linear-gradient(to top, rgba(6,8,14,.92) 0%, rgba(6,8,14,.55) 55%, rgba(6,8,14,0) 100%); }
.tile .t { font-weight: 650; font-size: 13.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.pg.red { color: var(--red); font-weight: 600; }
.tile .m .pg.red { color: #ff8f8f; }
.covtools { margin-top: 10px; }
.covmsg { margin-top: 6px; font-size: 12.5px; color: var(--muted); min-height: 18px; word-break: break-word; }
.covmsg.ok { color: var(--ok); } .covmsg.err { color: var(--danger); }
.edit { margin: 14px 0 4px; padding: 12px; border-radius: 12px; background: var(--surface2); display: grid; gap: 8px; }
.edit .lbl { font-size: 12.5px; color: var(--muted); }
.edit .stchips { display: flex; flex-wrap: wrap; gap: 6px; }
.edit .stchips .chip { height: 28px; }
.edit textarea { width: 100%; min-height: 64px; resize: vertical; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 8px 10px; font: inherit; font-size: 14px; }
.edit .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); }
.btn.danger.armed { background: var(--danger); color: var(--accent-ink); }
.delzone { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.hero .poster.drop { outline: 2px dashed var(--accent); outline-offset: 3px; }
.left { font-size: 12.5px; color: var(--muted); }
.left.red { color: var(--red); }
.left.stale { opacity: .8; font-style: italic; }
.tile .au { font-size: 11.5px; color: rgba(255,255,255,.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.tile .au.fav, .row .rau.fav, .hero .au .favbtn.on { color: #ff9db5; }
.row .rau { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .mau { display: none; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero .au { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px; align-items: center; }
.hero .au .chipau { height: 28px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface2); padding: 0 10px; font-size: 13px; }
.hero .au .chipau:hover { border-color: var(--accent); }
.hero .au .favbtn { height: 28px; width: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 14px; display: inline-flex; align-items: center; justify-content: center; margin-left: -4px; }
.hero .au .favbtn:hover { border-color: #ff9db5; }
.arow { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.arow .aname { flex: 1 1 auto; text-align: left; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); word-break: break-word; }
.arow .aname:hover { border-color: var(--accent); }
.arow .acount { color: var(--muted); font-size: 12.5px; min-width: 3em; text-align: right; }
.arow .favbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 16px; flex: none; }
.arow .favbtn.on { color: #ff9db5; border-color: #ff9db5; } opacity: 0; max-height: 0; margin-top: 0; transition: opacity .2s, max-height .25s, margin-top .25s; color: rgba(255,255,255,.82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile:hover .m, .tile:focus-visible .m { opacity: 1; max-height: 40px; margin-top: 4px; }
.tile .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); border-radius: 0 3px 3px 0; }
.tile .st { position: absolute; top: 8px; left: 8px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 9px; background: rgba(8,10,16,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; font-size: 13px; }
.tile .sc { position: absolute; top: 8px; right: 8px; height: 22px; padding: 0 8px; border-radius: 999px; background: rgba(8,10,16,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: 11px; display: grid; place-items: center; }
.tile.skeleton { background: linear-gradient(100deg, var(--surface2) 30%, var(--surface3) 50%, var(--surface2) 70%); background-size: 300% 100%; animation: shimmer 1.4s infinite linear; box-shadow: none; pointer-events: none; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── 清單 ── */
.rows { display: flex; flex-direction: column; gap: 6px; padding: 14px var(--gutter) 90px; }
.row { display: grid; grid-template-columns: 46px minmax(0, 1fr) minmax(0, 190px) auto; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 8px 12px 8px 8px; border-radius: 12px; border: 1px solid transparent; background: var(--surface); transition: background .15s, border-color .15s; }
.row:hover, .row:focus-visible { background: var(--surface2); border-color: var(--line); }
.row .th { width: 46px; height: 62px; border-radius: 8px; overflow: hidden; position: relative; background: var(--surface3); display: grid; place-items: center; font-weight: 800; color: var(--muted); }
.row .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.row .tt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ss { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rt { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
.row .info { min-width: 0; }

.cont { padding: 10px var(--gutter) 0; }
.cont h3 { margin: 6px 0 10px; font-size: 15px; }
.cont-row { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.cc { flex: none; width: 290px; display: grid; grid-template-columns: 1fr 44px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; scroll-snap-align: start; transition: border-color .15s, background .15s; }
.cc:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.cc-main { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; text-align: left; border: 0; background: transparent; padding: 10px 6px 10px 10px; min-width: 0; }
.cc .th { width: 52px; height: 70px; border-radius: 8px; overflow: hidden; position: relative; display: grid; place-items: center; font-weight: 800; }
.cc .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cc .info { min-width: 0; }
.cc .tt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc .ss { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc .bar2 { margin: 5px 0; }
.cc-go { display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); text-decoration: none; font-size: 15px; }
.cc-go:hover { background: var(--accent); color: var(--accent-ink); }
.empty { text-align: center; color: var(--muted); padding: 90px 20px; }
.empty .big { font-size: 42px; margin-bottom: 8px; }

/* ── 詳情側欄 ── */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100vw); background: var(--surface); z-index: 41; transform: translateX(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); box-shadow: -20px 0 50px -20px rgba(0,0,0,.6); display: flex; flex-direction: column; border-left: 1px solid var(--line); }
.drawer.on { transform: none; }
.dhead { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); padding-top: max(12px, env(safe-area-inset-top)); }
.dhead .grow { flex: 1; }
.grab { display: none; }
.dbody { overflow-y: auto; padding: 18px 20px 40px; -webkit-overflow-scrolling: touch; }
.hero { display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-items: start; }
.hero .poster { aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; position: relative; background: var(--surface3); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 54px; font-weight: 800; color: rgba(255,255,255,.25); }
.hero .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero h2 { margin: 0 0 4px; font-size: 20px; line-height: 1.3; word-break: break-word; }
.hero .au { color: var(--muted); margin-bottom: 10px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { height: 24px; border-radius: 999px; background: var(--surface3); padding: 0 10px; display: inline-flex; align-items: center; font-size: 12px; }
.note { margin: 16px 0 4px; padding: 10px 12px; border-radius: 10px; background: var(--surface2); white-space: pre-wrap; word-break: break-word; }
.sec { margin: 22px 0 8px; font-size: 12.5px; color: var(--muted); letter-spacing: .4px; text-transform: uppercase; }
.src { padding: 12px; border-radius: 12px; background: var(--surface2); margin-bottom: 10px; }
.src .h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.src .site { font-weight: 650; color: var(--accent); }
.src .when { color: var(--muted); font-size: 12px; margin-left: auto; }
.src .ch { word-break: break-word; }
.bar2 { height: 5px; border-radius: 3px; background: var(--surface3); margin: 8px 0; overflow: hidden; }
.bar2 > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
a.btn { text-decoration: none; }

/* ── 連線設定 ── */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.6); }
.modal[hidden] { display: none; }
.card { width: min(460px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: var(--shadow); }
.card h2 { margin: 0 0 6px; font-size: 19px; }
.card p { color: var(--muted); margin: 0 0 16px; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.field input { width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; }
.msg { min-height: 20px; margin: 4px 0 12px; font-size: 13px; }
.msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }
.card .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

@media (max-width: 640px) {
  :root { --gutter: 14px; --tile: 140px; }
  .wall { gap: 18px 12px; }
  .brand span.name { display: none; }
  .bar { gap: 8px; }
  .search { flex: 1 1 0; min-width: 0; }
  .search kbd { display: none; }
  .tools { margin-left: 0; width: 100%; justify-content: space-between; flex-wrap: nowrap; }
  .tools .btn { padding: 0 10px; }
  #refreshTxt { display: none; }
  #sort { max-width: 118px; }
  .cc { width: 250px; }
  .tools .size { display: none; }
  .drawer { top: auto; height: 92vh; width: 100vw; transform: translateY(105%); border-left: 0; border-radius: 18px 18px 0 0; }
  .drawer.on { transform: none; }
  .grab { display: block; flex: none; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; touch-action: none; }
  .dhead { touch-action: none; padding-top: 6px; } /* 往下滑關閉：這一條不要被瀏覽器當成捲動 */
  .hero { grid-template-columns: 110px 1fr; gap: 14px; }
  .row { grid-template-columns: 46px 1fr; }
  .row .rt, .row .rau { display: none; }
  .row .mau { display: block; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="bar">
      <div class="brand"><div class="logo" aria-hidden="true">📚</div><span class="name">漫畫圖書館</span></div>
      <div class="search">
        <span class="ico" aria-hidden="true">🔍</span>
        <label class="sr" for="q">搜尋</label>
        <input id="q" type="search" placeholder="搜尋書名、作者…　例：tag:在看 site:紳士 is:fav" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <div class="tools">
        <div class="seg" role="group" aria-label="檢視方式">
          <button id="v-wall" type="button" aria-pressed="true" title="封面牆">▦</button>
          <button id="v-list" type="button" aria-pressed="false" title="清單">☰</button>
        </div>
        <label class="sr" for="size">封面大小</label>
        <input id="size" class="size" type="range" min="120" max="280" step="8" title="封面大小">
        <select id="sort" class="btn" aria-label="排序">
          <option value="recent">最近閱讀</option>
          <option value="name">書名</option>
          <option value="sites">網站數</option>
          <option value="left">剩最多話沒看</option>
          <option value="fav">喜歡的作者優先</option>
        </select>
        <button id="theme" class="btn" type="button" title="切換主題">🌓</button>
        <button id="refresh" class="btn" type="button" title="重新整理">⟳ <span id="refreshTxt">重新整理</span></button>
        <button id="settings" class="btn" type="button" title="連線設定">⚙</button>
        <div class="morewrap">
          <button id="more" class="btn" type="button" title="更多功能" aria-label="更多功能" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu">⋯</button>
          <div id="moreMenu" class="menu" role="menu" hidden>
            <button id="bmBtn" class="menuitem" type="button" role="menuitem">🔖 書籤檢視器</button>
            <button id="auBtn" class="menuitem" type="button" role="menuitem">✍ 作者清單</button>
            <button id="allBtn" class="menuitem" type="button" role="menuitem">🔄 檢查全部網站更新</button>
            <button id="nicoBtn" class="menuitem" type="button" role="menuitem">🔄 只更新 NicoManga</button>
            <div id="nicoHint" class="hint"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="chips" class="chips" role="group" aria-label="篩選"></div>
  </header>
  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
  <div id="stat" class="stat"></div>
  <main id="main"></main>
</div>

<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="作品詳情" aria-hidden="true">
  <div class="grab" aria-hidden="true"></div>
  <div class="dhead">
    <button id="dprev" class="btn" type="button" title="上一部（←）">‹</button>
    <button id="dnext" class="btn" type="button" title="下一部（→）">›</button>
    <span class="grow"></span>
    <button id="dclose" class="btn" type="button" title="關閉（Esc）">✕</button>
  </div>
  <div id="dbody" class="dbody"></div>
</aside>

<div id="connect" class="modal" hidden>
  <form class="card" id="connectForm" autocomplete="off">
    <h2>連線到你的試算表</h2>
    <p>填入 Apps Script 的網址（結尾是 <code>/exec</code>）和密鑰。只會存在這個瀏覽器，不會傳給別人。</p>
    <label class="field"><span>Apps Script 網址</span><input id="cUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" required></label>
    <label class="field"><span>密鑰（TOKEN）</span><input id="cTok" type="password" placeholder="密鑰" required></label>
    <div id="cMsg" class="msg" role="status"></div>
    <div class="btns">
      <button id="cLogout" class="btn" type="button" hidden title="清掉這個瀏覽器裡的網址、密鑰、資料與封面">登出並清除本機資料</button>
      <button id="cCancel" class="btn" type="button" hidden>取消</button>
      <button id="cTest" class="btn" type="button">測試連線</button>

</div>

<div id="pick" class="modal" hidden>

    <div id="pickConfirm" class="pickconfirm" role="status" hidden></div>
    <div id="pickMsg" class="msg" role="status"></div>
    <div class="btns"><button id="pickCancel" class="btn" type="button">取消</button><button id="pickOk" class="btn primary" type="button" hidden>確定</button></div>
  </div>
</div>
<div id="au" class="modal" hidden>
  <div class="card pickcard" role="dialog" aria-modal="true" aria-labelledby="auTitle">
    <h2 id="auTitle">✍ 作者清單</h2>
    <p id="auDesc"></p>
    <input id="auQ" class="pickq" type="search" placeholder="搜尋作者…" autocomplete="off" spellcheck="false" aria-label="搜尋作者">
    <div id="auList" class="picklist"></div>
    <div id="auMsg" class="msg" role="status"></div>
    <div class="btns"><button id="auClose" class="btn" type="button">關閉</button></div>
  </div>
</div>
<div id="bm" class="modal" hidden>
  <div class="card pickcard" role="dialog" aria-modal="true" aria-labelledby="bmTitle">
    <h2 id="bmTitle">🔖 書籤檢視器</h2>
    <p id="bmDesc"></p>
    <input id="bmQ" class="pickq" type="search" placeholder="搜尋書名、章節…" autocomplete="off" spellcheck="false" aria-label="搜尋書籤">
    <div id="bmList" class="picklist"></div>
    <div id="bmMsg" class="msg" role="status"></div>
    <div class="btns"><button id="bmClose" class="btn" type="button">關閉</button></div>
  </div>
</div>

<script>

    armButton(d, lab, async () => { try { await deleteEntries(g, g.entries, true); render(); closeDrawer(); banner('已刪除「' + g.title + '」', 'info'); setTimeout(() => { if (!lastError) banner(''); }, 4000); } catch (err) { msg.className = 'covmsg err'; msg.textContent = '✗ ' + (err && err.message ? err.message : err); } });
    z.append(hint, d); body.append(z);
  }
  $('drawer').classList.add('on'); $('drawer').setAttribute('aria-hidden', 'false'); $('scrim').classList.add('on');
  if (!focusSel) body.scrollTop = 0;
  const fe = focusSel && body.querySelector(focusSel);
  (fe || $('dclose')).focus({ preventScroll: true });
}
function hideDrawer() {
  const was = openKey;
  openKey = ''; editMode = false; editNote = null;
  $('drawer').classList.remove('on'); $('drawer').setAttribute('aria-hidden', 'true'); $('scrim').classList.remove('on');
  document.body.style.overflow = '';
  if (was) { // 焦點回到打開它的那張封面（鍵盤操作才不會迷路）
    const back = drawerOpener && drawerOpener.isConnected ? drawerOpener : document.querySelector('[data-key="' + (window.CSS && CSS.escape ? CSS.escape(was) : was) + '"]');
    if (back && back.focus) back.focus({ preventScroll: true });
  }
  drawerOpener = null;
}
function closeDrawer() {
  if (drawerPushed) { drawerPushed = false; try { history.back(); return; } catch (e) { /* 退回直接關 */ } }
  hideDrawer();
}
addEventListener('popstate', () => { drawerPushed = false; if (openKey) hideDrawer(); });
// 方向鍵在封面牆／清單裡移動焦點：← → 前後一部、↑ ↓ 上下一排（清單就是上下一列）
function gridMove(cur, key) {
  if (!cur || !cur.closest || !cur.closest('#items')) return false;
  const items = [...$('items').querySelectorAll('.tile, .row')];
  const i = items.indexOf(cur);
  if (i < 0) return false;
  const wall = ui.view !== 'list', down = key === 'ArrowDown', up = key === 'ArrowUp';
  let to = null;
  if (key === 'ArrowRight' && wall) to = items[i + 1];
  else if (key === 'ArrowLeft' && wall) to = items[i - 1];
  else if (down || up) {
    if (!wall) to = items[i + (down ? 1 : -1)];
    else {
      const r = cur.getBoundingClientRect(), dir = down ? 1 : -1;
      let bestDy = Infinity, bestDx = Infinity;
      items.forEach((o) => {
        if (o === cur) return;
        const q = o.getBoundingClientRect(), dy = (q.top - r.top) * dir, dx = Math.abs(q.left - r.left);
        if (dy < 4) return; // 同一排或在反方向
        if (dy < bestDy - 4 || (Math.abs(dy - bestDy) <= 4 && dx < bestDx)) { bestDy = Math.min(dy, bestDy); bestDx = dx; to = o; }
      });
    }
  } else return false;
  if (to) to.focus();
  return true; // 到頭了也算處理過（不要讓頁面跟著捲）
}
/* ── 手機：詳情（從底部升起的卡片）往下滑關閉 ──
 * 從最上面那條（小把手＋標題列）往下拖：卡片跟著手指走；拖過一段距離、或快速往下甩就關閉，否則彈回去。
 * 輕點按鈕（上一部／下一部／✕）照常運作：只有真的拖動才算滑動。 */
(function swipeDown() {
  const dr = $('drawer');
  const mobile = () => matchMedia('(max-width: 640px)').matches;
  let st = null, justDragged = false;
  const reset = () => { dr.style.transition = ''; dr.style.transform = ''; };
  [dr.querySelector('.grab'), dr.querySelector('.dhead')].forEach((el) => {
    el.addEventListener('pointerdown', (e) => { if (!mobile() || !openKey || (e.pointerType === 'mouse' && e.button !== 0)) return; st = { y0: e.clientY, t0: e.timeStamp, dy: 0, id: e.pointerId, moved: false }; });
    el.addEventListener('pointermove', (e) => {
      if (!st || e.pointerId !== st.id) return;
      const dy = e.clientY - st.y0;
      if (!st.moved) { if (Math.abs(dy) < 8) return; st.moved = true; try { el.setPointerCapture(e.pointerId); } catch (err) { /* 不支援就算了 */ } dr.style.transition = 'none'; }
      st.dy = Math.max(0, dy); // 只能往下拖
      dr.style.transform = 'translateY(' + st.dy + 'px)';
    });
    const end = (e, cancelled) => {
      if (!st || e.pointerId !== st.id) return;
      const s = st; st = null;
      if (!s.moved) return;
      justDragged = true; setTimeout(() => { justDragged = false; }, 60);
      const v = s.dy / Math.max(1, e.timeStamp - s.t0), h = dr.getBoundingClientRect().height;
      if (!cancelled && (s.dy > Math.min(120, h * 0.25) || (v > 0.6 && s.dy > 30))) {
        // 直接關（不等瀏覽器的返回）：同一個動作裡清掉拖動的位移並移掉 .on，卡片就從目前位置滑出去
        reset(); hideDrawer();
        if (drawerPushed) { drawerPushed = false; try { history.back(); } catch (err) { /* 回不去就算了 */ } } // 把開詳情時多的那一格紀錄退掉
      } else reset();
    };
    el.addEventListener('pointerup', (e) => end(e, false));
    el.addEventListener('pointercancel', (e) => end(e, true));
  });
  dr.addEventListener('click', (e) => { if (justDragged) { e.stopPropagation(); e.preventDefault(); } }, true); // 拖完放開不要誤觸按鈕
})();
function stepDrawer(d) {
  if (!openKey) return;
  const i = shown.findIndex((g) => g.key === openKey);
  const n = shown[i + d];
  if (n) openDrawer(n.key);
}

/* ── 載入資料 ── */
function banner(msg, kind, retry) {
  const b = $('banner');
  b.textContent = '';
  if (!msg) { b.hidden = true; return; }
  b.hidden = false; b.className = 'banner' + (kind === 'info' ? ' info' : '');
  const t = document.createElement('span'); t.className = 'grow'; t.textContent = msg; b.append(t);
  if (retry) { const r = document.createElement('button'); r.className = 'btn'; r.type = 'button'; r.textContent = '重試'; r.addEventListener('click', refresh); b.append(r); }
}
async function refresh() {
  if (!connected()) { openConnect(true); return; }
  if (loading) return;
  loading = true;
  $('refresh').disabled = true; $('refreshTxt').textContent = '載入中…';
  if (!data) render();
  try {
    const r = await api({ type: 'shelf' });
    data = { at: Date.now(), rows: r.rows || [], groups: r.groups || {} };
    noCache = !LS.set(DATA_KEY, data);
    lastError = '';
    banner('');
    loading = false;
    render();
    syncCovers();
  } catch (e) {
    lastError = e && e.message ? e.message : String(e);
    loading = false;
    banner('連線失敗：' + lastError + (/密鑰/.test(lastError) ? '（請按右上角 ⚙ 檢查密鑰）' : '') + (data ? '。目前顯示的是' + relTime(data.at) + '的資料。' : ''), 'err', true);
    render();
  } finally {
    loading = false;
    $('refresh').disabled = false; $('refreshTxt').textContent = '重新整理';
  }
}

/* ── 更多功能：書籤檢視器、更新檢查 ──
 * 檢查更新要讀各個漫畫網站，圖書館（網頁）自己做不到（跨網域限制；NicoManga 還要開分頁讓網頁自己渲染），所以請油猴腳本 v3.22.0 以上幫忙：
 * 腳本在這個網頁上標 data-tmr-bridge="1"；按鈕對 document 發 'tmr-update-all'（全部網站）或 'tmr-nico-toggle'（只有 NicoManga），再按一次是停止；
 * 腳本把狀態（JSON 文字）寫在 data-tmr-nico 並發 'tmr-nico-state'；書籤「前往」用 data-tmr-jump＋'tmr-jump' 請腳本記下要跳到第幾頁。 */
const bridgeOn = () => document.documentElement.getAttribute('data-tmr-bridge') === '1';
let updRunning = false, updMode = '';
function setMenu(open) { $('moreMenu').hidden = !open; $('more').setAttribute('aria-expanded', open ? 'true' : 'false'); }
function updateUpdItems() {
  $('bmBtn').textContent = '🔖 書籤檢視器' + (bms.length ? '（' + bms.length + '）' : '');
  $('auBtn').textContent = '✍ 作者清單' + (favCount() ? '（♥ ' + favCount() + '）' : '');
  $('allBtn').textContent = updRunning && updMode === 'all' ? '⏹ 停止更新' : '🔄 檢查全部網站更新';
  $('nicoBtn').textContent = updRunning && updMode === 'nico' ? '⏹ 停止更新 NicoManga' : '🔄 只更新 NicoManga';
  $('allBtn').disabled = updRunning && updMode !== 'all'; $('nicoBtn').disabled = updRunning && updMode !== 'nico';
  $('nicoHint').textContent = bridgeOn() ? '用油猴腳本在背景更新章節（NicoManga 會一部一部開分頁），完成後這裡會自動重新整理。更新中再按一次會停止。' : '更新檢查需要油猴腳本 v3.22.0 以上，並讓它在這個網頁啟用。';
}
$('more').addEventListener('click', () => { const open = $('moreMenu').hidden; setMenu(open); if (open) { updateUpdItems(); $('bmBtn').focus(); } });
document.addEventListener('mousedown', (e) => { if (!$('moreMenu').hidden && !(e.target.closest && e.target.closest('.morewrap'))) setMenu(false); });
$('bmBtn').addEventListener('click', () => { setMenu(false); openBm(); });
$('auBtn').addEventListener('click', () => { setMenu(false); openAu(); });
function runUpd(mode) {
  setMenu(false);
  if (!bridgeOn()) { banner('找不到油猴腳本：請把腳本更新到 v3.22.0 以上，並確認它在這個網頁有啟用（Tampermonkey 的圖示上要看得到這支腳本）。', 'err'); return; }
  updMode = mode;
  document.dispatchEvent(new Event(mode === 'all' ? 'tmr-update-all' : 'tmr-nico-toggle'));
}
$('allBtn').addEventListener('click', () => runUpd('all'));
$('nicoBtn').addEventListener('click', () => runUpd('nico'));
document.addEventListener('tmr-bridge-ready', updateUpdItems);
document.addEventListener('tmr-nico-state', () => {
  let r = null;
  try { r = JSON.parse(document.documentElement.getAttribute('data-tmr-nico') || 'null'); } catch (e) { r = null; }
  if (!r) return;
  updRunning = r.s === 'run' || r.s === 'stopping';
  if (r.all) updMode = 'all';
  updateUpdItems();
  if (updRunning) { banner(String(r.text || ''), 'info'); return; }
  if (r.s === 'error') { banner(String(r.text || '更新失敗'), 'err'); return; }
  // 做完（或停止）：腳本已經把最新話數送到試算表，重新載入資料就看得到
  refresh().then(() => { banner(String(r.text || ''), 'info'); setTimeout(() => { if (!lastError && !updRunning) banner(''); }, 12000); });
});

/* ── 連線設定視窗 ── */
function openConnect(force) {
  $('cUrl').value = cfg.url || ''; $('cTok').value = cfg.token || '';
  $('cMsg').textContent = ''; $('cMsg').className = 'msg';
  $('cCancel').hidden = !!force && !connected();
  $('cLogout').hidden = !connected();
  $('cLogout').textContent = '登出並清除本機資料';
  $('connect').hidden = false;
  setTimeout(() => $('cUrl').focus(), 0);
}
function closeConnect() { $('connect').hidden = true; }
$('connect').addEventListener('mousedown', (e) => { if (e.target === $('connect') && connected()) closeConnect(); });
async function testConnect() {
  const url = $('cUrl').value.trim(), token = $('cTok').value;
  const m = $('cMsg');
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { m.className = 'msg err'; m.textContent = '網址要是 https://script.google.com/…/exec'; return false; }
  m.className = 'msg'; m.textContent = '測試中…';
  const keep = cfg; cfg = { url, token };
  try { await api({ type: 'ping' }); m.className = 'msg ok'; m.textContent = '✓ 連線成功'; return true; }
  catch (e) { m.className = 'msg err'; m.textContent = '✗ ' + (e && e.message ? e.message : e); return false; }
  finally { cfg = keep; }
}

/* ── 事件 ── */
function applyTheme() { document.documentElement.setAttribute('data-theme', ui.theme); }
function applySize() {
  if (ui.size) document.documentElement.style.setProperty('--tile', ui.size + 'px');
  $('size').value = ui.size || parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile'), 10) || 176;
}
let qT = 0;
$('q').addEventListener('input', (e) => { clearTimeout(qT); qT = setTimeout(() => { query = e.target.value; shown = visibleGroups(); render(); }, 120); });
$('v-wall').addEventListener('click', () => { ui.view = 'wall'; saveUi(); render(); });
$('v-list').addEventListener('click', () => { ui.view = 'list'; saveUi(); render(); });
$('sort').addEventListener('change', (e) => { ui.sort = e.target.value; saveUi(); render(); });
$('size').addEventListener('input', (e) => { ui.size = +e.target.value; saveUi(); applySize(); });
$('theme').addEventListener('click', () => { ui.theme = ui.theme === 'auto' ? 'dark' : ui.theme === 'dark' ? 'light' : 'auto'; saveUi(); applyTheme(); $('theme').title = '主題：' + ({ auto: '跟隨系統', dark: '深色', light: '淺色' })[ui.theme]; });
$('refresh').addEventListener('click', refresh);
$('settings').addEventListener('click', () => openConnect(false));
$('dclose').addEventListener('click', closeDrawer);
$('scrim').addEventListener('click', closeDrawer);
$('dprev').addEventListener('click', () => stepDrawer(-1));
$('dnext').addEventListener('click', () => stepDrawer(1));
$('cCancel').addEventListener('click', closeConnect);
$('cTest').addEventListener('click', testConnect);
// 登出：公用電腦用完時清掉網址、密鑰、快取的資料與封面（按兩次確認）
let logoutArmed = false;
$('cLogout').addEventListener('click', async () => {
  if (!logoutArmed) { logoutArmed = true; $('cLogout').textContent = '確定登出？'; setTimeout(() => { logoutArmed = false; $('cLogout').textContent = '登出並清除本機資料'; }, 4000); return; }
  [CFG_KEY, DATA_KEY, UI_KEY].forEach((k) => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }); // 先同步清掉網址、密鑰、資料（不要等 IndexedDB）
  covUrl.forEach((h) => URL.revokeObjectURL(h.url));
  try { const db = await idb(); if (db) db.close(); } catch (e) { /* ignore */ }
  try { indexedDB.deleteDatabase('manga-library'); } catch (e) { /* ignore */ }
  location.reload();
});
$('connectForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!(await testConnect())) return;
  cfg = { url: $('cUrl').value.trim(), token: $('cTok').value };
  LS.set(CFG_KEY, cfg);
  closeConnect();
  data = null; try { localStorage.removeItem(DATA_KEY); } catch (x) { /* ignore */ }
  refresh();
});
document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '');
  if (e.key === 'Escape') {
    if (!$('pick').hidden) { if (pickSt && pickSt.sel) { pickSt.sel = null; renderPick(); $('pickQ').focus(); } else closePick(); return; }
    if (!$('bm').hidden) { hideModal('bm'); return; }
    if (!$('au').hidden) { hideModal('au'); return; }
    if (!$('moreMenu').hidden) { setMenu(false); $('more').focus(); return; }
    if (!$('connect').hidden && connected()) { closeConnect(); return; }
    if (openKey) { closeDrawer(); return; }
    if (document.activeElement === $('q') && $('q').value) { $('q').value = ''; query = ''; render(); return; }
  }
  if (typing || !$('pick').hidden || !$('bm').hidden || !$('au').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('q').focus(); }
  else if (openKey && e.key === 'ArrowLeft') stepDrawer(-1);
  else if (openKey && e.key === 'ArrowRight') stepDrawer(1);
  else if (!openKey && $('connect').hidden && $('pick').hidden && $('bm').hidden && $('au').hidden && e.key.startsWith('Arrow') && gridMove(document.activeElement, e.key)) e.preventDefault();
});
// 抽屜打開時，Tab 不要跑到後面的頁面（簡單的焦點圈住）
$('drawer').addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return;
  const f = [...$('drawer').querySelectorAll('button, a[href]')].filter((x) => !x.disabled);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
addEventListener('online', () => { if (lastError) refresh(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && connected() && data && !loading && Date.now() - data.at > 10 * 60 * 1000) refresh(); }); // 放在背景很久再切回來：自動更新一次

/* ── 啟動 ── */
(async function start() {
  applyTheme(); applySize(); $('sort').value = ui.sort;
  $('theme').title = '主題：' + ({ auto: '跟隨系統', dark: '深色', light: '淺色' })[ui.theme];
  render(); // 先用快取的資料畫出來（不等封面），封面從 IndexedDB 讀好後再補上
  if (!connected()) { openConnect(true); return; }
  if (data) banner('顯示的是上次的資料，正在更新…', 'info');
  await loadCachedCovers();
  repaintCovers();
  refresh();
})();
</script>
